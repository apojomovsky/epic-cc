name = "p18f2550"
core = "pic18"
flash_words = 16384
# Widened past the DFP's own gpr0-gpr3: it understates this part's RAM by
# half, confirmed against gputils' 18f2550_g.lkr (gpr0-gpr7), same defect
# on its p18f4550 entry too. See scripts/gen-device.py's module docstring.
# `gen-device.py p18f2550 --check` against a local XC8 install will flag
# this as drift; that is expected until the DFP is fixed upstream.
ram_banks = [[0x0010, 0x07FF]]
access_bank = [0x0000, 0x005F]
fixed_retval = [0x0000, 0x000F]
stack_depth = 31
interrupt_vectors = [0x0008, 0x0018]

[provenance]
tier = "atdf"
source = "PIC18F2550.PIC"
pack = "Microchip.PIC18Fxxxx_DFP"
sha256 = "dbd5e93ee0e8e3f27c5a0e4fc9bbfbc47c497616f29439f26d0199153d6890cf"

[config]
base_byte_addr = 0x300000
num_bytes = 14
erased_baseline = [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF]

[[config.fields]]
name = "plldiv"
byte_offset = 0
mask = 0x07
shift = 0
values = [{ name = "noprescale", bits = 0 }, { name = "div2", bits = 1 }, { name = "div3", bits = 2 }, { name = "div4", bits = 3 }, { name = "div5", bits = 4 }, { name = "div6", bits = 5 }, { name = "div10", bits = 6 }, { name = "div12", bits = 7 }]

