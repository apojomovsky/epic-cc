[package]
name = "driver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
device = { path = "../device" }
ir = { path = "../ir" }
irparse = { path = "../irparse" }
wholeprog = { path = "../wholeprog" }
legalize = { path = "../legalize" }
callgraph = { path = "../callgraph" }
gimli = { version = "0.31", features = ["read"] }
object = { version = "0.36", default-features = false, features = ["read_core", "write_core", "elf", "std"] }
alloc = { path = "../alloc" }
isel = { path = "../isel" }
isel-pic-baseline = { path = "../isel-pic-baseline" }
isel-pic14e = { path = "../isel-pic14e" }
isel-pic18 = { path = "../isel-pic18" }
banking = { path = "../banking" }
schedule = { path = "../schedule" }
peephole = { path = "../peephole" }
asm = { path = "../asm" }

[dev-dependencies]
epic-cc-gdbserver = { path = "../gdbserver" }
pic14-sim = { path = "../sim" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "epic-cc"
path = "src/main.rs"

[lib]
name = "driver"
path = "src/lib.rs"
