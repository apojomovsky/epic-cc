name = "p12f675"
core = "pic14"
# Narrowed from the ini's own ROMSIZE=400 (1024): gpasm rejects org 0x3FF
# ("Address exceeds maximum range... BADROM_START: 0x03FF"), confirming
# gputils treats the top word as reserved (the factory OSCCAL calibration
# word on this part), not user-addressable flash. 1023 is the real usable
# count -- p12f629.toml carries the identical defect and correction.
flash_words = 1023
ram_banks = [[0x0020, 0x004F]]
common_ram = [0x0050, 0x005F]
stack_depth = 8
interrupt_vectors = [0x0004]

[provenance]
tier = "atdf"
source = "PIC12F675.PIC"
pack = "Microchip.PIC10-12Fxxx_DFP"
sha256 = "e994b0bd96308a45fe654cc34f4947be3a14d1a9302ed899d5bd06bb31558254"

[config]
base_byte_addr = 0x400E
num_bytes = 2
erased_baseline = [0xFF, 0x31]

