name: release

# Tag-triggered: builds the Linux bundle in the docker release stage and the
# Windows bundle by slicing the official LLVM MSVC release, smoke-tests each
# shipped binary, asserts every zip carries epic-cc and epic-cc-gdbserver, and attaches both zips + checksums to the GitHub release.
# workflow_dispatch is enabled so the pipeline can be exercised before the
# first real tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # See ci.yml's warm-toolchain-cache job / toolchain-cache.yml.
  warm-toolchain-cache:
    uses: ./.github/workflows/toolchain-cache.yml

  linux:
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release bundle (cached clang layer)
        env:
          CACHE_REF: ghcr.io/${{ github.repository }}-toolchain
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/warm-toolchain-cache.sh --target release --load \
            --build-arg EPIC_CC_VERSION="$ver" -t "epic-cc-release:$ver"

      - name: Extract bundle from image
        run: |
          ver="${GITHUB_REF_NAME#v}"
          docker create --name epic-cc-bundle "epic-cc-release:$ver"
          docker cp "epic-cc-bundle:/out" dist
          docker rm epic-cc-bundle

      - name: Zip
        run: |
          ver="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../epic-cc-${ver}-x86_64-linux.zip" "epic-cc-${ver}-x86_64-linux")

      - uses: actions/upload-artifact@v6
        with:
          name: linux-bundle
          path: epic-cc-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy, rust-src

      - name: Build epic-cc and epic-cc-gdbserver
        run: |
          $env:EPIC_CC_VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          cargo build --release -p driver -p epic-cc-gdbserver

      - name: Download and extract LLVM 20.1.8 MSVC bundle
        run: |
          curl.exe -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang%2Bllvm-20.1.8-x86_64-pc-windows-msvc.tar.xz"
          tar -xJf llvm.tar.xz

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $src = "clang+llvm-20.1.8-x86_64-pc-windows-msvc"
          $bundle = "epic-cc-$ver-x86_64-windows"
          New-Item -ItemType Directory -Force -Path "$bundle\clang\bin", "$bundle\clang\lib" | Out-Null
          Copy-Item "$src\bin\clang.exe" "$bundle\clang\bin\"
          Copy-Item "$src\bin\*.dll" "$bundle\clang\bin\"
          Copy-Item "$src\bin\llvm-link.exe" "$bundle\clang\bin\"
          Copy-Item "$src\bin\opt.exe" "$bundle\clang\bin\"
          Copy-Item -Recurse "$src\lib\clang" "$bundle\clang\lib\clang"
          Copy-Item "target\release\epic-cc.exe" "$bundle\"
          Copy-Item "target\release\epic-cc-gdbserver.exe" "$bundle\"
          & ".\$bundle\epic-cc.exe" --dump-include-dir "$bundle\include"
          python scripts\gen_devices_manifest.py "$bundle\devices.json"
          # The MSVC archive does not ship LICENSE.TXT; fetch the pinned
          # source license, same file and checksum the Linux bundle uses.
          curl.exe -fsSL -o "$bundle\LICENSE.clang.txt" "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-20.1.8/llvm/LICENSE.TXT"
          if ((Get-FileHash "$bundle\LICENSE.clang.txt" -Algorithm SHA256).Hash.ToLowerInvariant() -ne "8d85c1057d742e597985c7d4e6320b015a9139385cff4cbae06ffc0ebe89afee") {
            throw "clang license checksum mismatch"
          }

      - name: Smoke test (env path vs bundled discovery)
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $bundle = "epic-cc-$ver-x86_64-windows"
          $env:PIC8_CLANG_UNWRAPPED = "$PWD\$bundle\clang\bin\clang.exe"
          $env:PIC8_CLANG_RESOURCE_DIR = "$PWD\$bundle\clang\lib\clang\20"
          & ".\$bundle\epic-cc.exe" crates\driver\tests\fixtures\add.c -o env.hex
          Remove-Item Env:PIC8_CLANG_UNWRAPPED
          Remove-Item Env:PIC8_CLANG_RESOURCE_DIR
          & ".\$bundle\epic-cc.exe" crates\driver\tests\fixtures\add.c -o bundled.hex
          if ((Get-FileHash env.hex).Hash -ne (Get-FileHash bundled.hex).Hash) {
            throw "smoke mismatch: env-path and bundled-discovery HEX differ"
          }
          $inc = & ".\$bundle\epic-cc.exe" --print-include-dir
          if ($inc -ne "$PWD\$bundle\include") {
            throw "print-include-dir mismatch: $inc"
          }

      - name: Smoke test gdbserver (listens, accepts a connection)
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $bundle = "epic-cc-$ver-x86_64-windows"
          $p = Start-Process -PassThru -NoNewWindow -FilePath ".\$bundle\epic-cc-gdbserver.exe" `
            -ArgumentList "bundled.hex", "bundled.hex", "--port", "38123"
          try {
            $client = $null
            for ($i = 0; $i -lt 50 -and -not $client; $i++) {
              try { $client = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 38123) }
              catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $client) { throw "epic-cc-gdbserver.exe never listened on 38123" }
            $client.Close()
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path "epic-cc-$ver-x86_64-windows" -DestinationPath "epic-cc-$ver-x86_64-windows.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-bundle
          path: epic-cc-*.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-bundle'
          path: dist

      - name: List bundle contents
        run: for z in dist/*-bundle/*.zip; do echo "== $z"; unzip -l "$z"; done

      - name: Check every bundle ships epic-cc and epic-cc-gdbserver
        run: python3 scripts/check_release_bundle.py dist/*-bundle/*.zip

      - uses: ./.github/actions/install-git-cliff

      - name: Generate release notes
        env:
          # git-cliff enriches commits with GitHub PR metadata over the
          # REST API; unauthenticated it hits the 60 req/hr anonymous
          # rate limit within a single run once a tag is in play.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git cliff --tag "$GITHUB_REF_NAME" --latest --strip header -o notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum linux-bundle/*.zip windows-bundle/*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            linux-bundle/*.zip windows-bundle/*.zip SHA256SUMS \
            --title "epic-cc $GITHUB_REF_NAME" \
            --notes-file ../notes.md
