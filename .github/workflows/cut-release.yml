name: cut-release

# Manual trigger: computes the next semver from Conventional Commits
# (git-cliff) and regenerates CHANGELOG.md. master's ruleset requires a PR
# with required checks green, so this opens a release PR, auto-merges it,
# then tags the result; that tag push is what triggers release.yml's
# build/publish. Uses EPIC_TASKS_TOKEN (a PAT, already a repo secret) to
# push the branch and open the PR: a PR opened with the default
# GITHUB_TOKEN never triggers other workflows (GitHub's loop-prevention
# rule), so its required checks would never run and it would sit BLOCKED
# forever, confirmed the hard way (PR #417).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    env:
      # git-cliff enriches commits with GitHub PR metadata over the REST
      # API; unauthenticated it hits the 60 req/hr anonymous rate limit
      # within a single run once a tag is in play.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.EPIC_TASKS_TOKEN }}

      - uses: ./.github/actions/install-git-cliff

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            auto)
              next="$(git cliff --bumped-version)"
              ;;
            patch|minor|major)
              current="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
              current="${current#v}"
              IFS='.' read -r major minor patch <<< "${current:-0.0.0}"
              case "$BUMP" in
                patch) patch=$((patch + 1)) ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                major) major=$((major + 1)); minor=0; patch=0 ;;
              esac
              next="v${major}.${minor}.${patch}"
              ;;
            *)
              echo "::error::unknown bump input '$BUMP'"
              exit 1
              ;;
          esac
          echo "resolved next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Regenerate CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "$VERSION" -o CHANGELOG.md
          # the template leaves a trailing blank line; the pre-commit hook
          # rejects it as trailing whitespace.
          sed -i -e '${/^$/d}' CHANGELOG.md

      - name: Open the release PR and enable auto-merge
        id: pr
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.EPIC_TASKS_TOKEN }}
        run: |
          branch="chore/release-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push origin "$branch"
          url="$(gh pr create --base master --head "$branch" \
            --title "chore(release): $VERSION" \
            --body "Automated release PR (cut-release.yml). Merging tags the resulting commit as $VERSION.")"
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr merge "$number" --auto --squash

      - name: Wait for the release PR to merge
        id: merged
        env:
          GH_TOKEN: ${{ secrets.EPIC_TASKS_TOKEN }}
        run: |
          number="${{ steps.pr.outputs.number }}"
          for _ in $(seq 1 90); do
            state="$(gh pr view "$number" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              sha="$(gh pr view "$number" --json mergeCommit --jq .mergeCommit.oid)"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "::error::release PR #$number was closed without merging"
              exit 1
            fi
            sleep 20
          done
          echo "::error::release PR #$number did not merge within 30 minutes"
          exit 1

      - name: Tag the merged release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.merged.outputs.sha }}
        run: |
          git fetch origin "$SHA"
          git tag -a "$VERSION" "$SHA" -m "$VERSION"
          git push origin "$VERSION"
