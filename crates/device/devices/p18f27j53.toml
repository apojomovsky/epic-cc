name = "p18f27j53"
core = "pic18"
flash_words = 65532
# Widened past the DFP's own gpr0-gpr12 (0x10-0xCFF): it understates this
# part's RAM, confirmed against gputils' 18f27j53_g.lkr, which carries
# gpr0-gpr14 up to 0xEAF. Same DFP defect class as p18f2550's ram_banks
# comment; see scripts/gen-device.py's module docstring.
ram_banks = [[0x0010, 0x0EAF]]
access_bank = [0x0000, 0x005F]
fixed_retval = [0x0000, 0x000F]
stack_depth = 31
interrupt_vectors = [0x0008, 0x0018]

[provenance]
tier = "atdf"
source = "PIC18F27J53.PIC"
pack = "Microchip.PIC18F-J_DFP"
sha256 = "7329f0eb13f14d603cd2f1af4c881f7d7bbfe56e7f3ca3fba756c6b01e31e0cf"

[config]
base_byte_addr = 0x1FFF8
num_bytes = 8
erased_baseline = [0xFF, 0xF7, 0xFF, 0xFF, 0xFF, 0xFB, 0xFF, 0xFB]

