name: nightly

# Nightly (and manual) lightweight for every device in crates/device/devices/*.toml.
# PR CI runs this only for TOMLs touched in the diff; nightly proves no TOML
# drifted while no PR touched it. No fuzz, no per-device full fixtures, a
# fuzz bug is core-wide and the canonical already covers it (see ADR-019
# and docs/superpowers/specs/2026-08-22-pic-variants-design.md §8).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # See ci.yml's warm-toolchain-cache job / toolchain-cache.yml: avoids
  # devices-all and sdcc-parity racing to independently rebuild + push the
  # same GHCR cache on a cold cache.
  warm-toolchain-cache:
    uses: ./.github/workflows/toolchain-cache.yml

  devices-all:
    name: devices-all lightweight
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo target dir
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-nightly-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-nightly-
            cargo-${{ runner.os }}-

      - name: Cache cargo home
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Lightweight for every device
        run: |
          set -euo pipefail
          for f in crates/device/devices/*.toml; do
            stem=$(basename "$f" .toml)
            echo "::group::sanity $stem"
            docker run --rm -v "$PWD:/workspace" -w /workspace -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home epic-cc-ci:latest bash scripts/sanity.sh "$stem"
            echo "::endgroup::"
          done

      # The docker run above executes as root, so target/ ends up
      # root-owned on this bind-mounted host path; without this, the
      # "Cache cargo target dir" step's post-job save fails silently.
      - name: Fix target dir ownership (container runs as root)
        run: sudo chown -R "$(id -u):$(id -g)" target

  sdcc-parity:
    name: sdcc-parity differential
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo target dir
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-sdcc-parity-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-sdcc-parity-
            cargo-${{ runner.os }}-

      - name: Cache cargo home
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Run the SDCC parity differential
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home \
            -e GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            epic-cc-ci:latest bash scripts/sdcc-parity.sh

      # See devices-all's same-named step above.
      - name: Fix target dir ownership (container runs as root)
        run: sudo chown -R "$(id -u):$(id -g)" target

  sdcc-regression:
    name: sdcc regression-suite pass rate (Tier 3)
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Run the SDCC regression suite and report pass rate
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            epic-cc-ci:latest bash scripts/sdcc-regression.sh
