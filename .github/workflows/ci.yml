name: ci

# Stratified CI per the PIC variants design (2026-08-22 §8, ADR-019).
#
# A compiler bug is core-wide (wrong isel for a C construct, fails on one
# pic14 iff it fails on every pic14) or data-wide (wrong TOML value -
# caught by schema + one sanity compile for that device). Running
# devices × fixtures × fuzz on every PR is the HAL trap.
#
# Split:
# - canonical per core (always, full): p16f877a (pic14) + p18f4550 (pic18).
#   Fixed 2-job matrix. Runs the full gate that ran as the single job
#   before: cargo test for every crate (15 e2e fixtures → HEX → gpasm
#   byte-match + sim + fuzz seeded). Cost O(cores)=2, not O(devices).
# - per-device lightweight (on change, cheap, ~0.5 s/device): for each
#   devices/*.toml touched in the PR diff, schema/invariants + alloc
#   empty-prog + 80-byte global placement + asm flash-bound + single
#   add.c → HEX + gpasm -p <device> round-trip. No fuzz, no float tortures.
#
# PR CI = canonical full + lightweight only for TOMLs touched in the diff
# (git diff --name-only origin/master -- crates/device/devices/*.toml).
# Nightly cron = lightweight for all devices (see nightly.yml).
# Full per-device fuzz never, a fuzz bug is core-wide and the canonical
# already found it.
#
# Non-code PRs (doc-only, allowlisted by scripts/ci_noncode_check.py, the
# same classifier epic-hal uses) skip the Docker build and the full
# build+test loop in every heavy job, but the prose job always runs: a
# trailing-whitespace or em-dash violation can live in a .md file too.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prose:
    name: prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out epic-tasks
        uses: actions/checkout@v5
        with:
          repository: apojomovsky/epic-tasks
          path: epic-tasks
          token: ${{ secrets.EPIC_TASKS_TOKEN }}

      - name: Lint added comment blocks
        run: python3 epic-tasks/epic-tasks prose --verify

  # Warms ghcr.io/<repo>-toolchain's registry cache once before the jobs
  # below each independently build the image against it. Without this,
  # canonical (x2) + hal-887 + devices-changed would all race to rebuild
  # and push the same cache ref on a cold cache (a genuine clang-builder
  # or base change, or an ubuntu digest bump), paying the ~2h LLVM build
  # up to 4x in parallel instead of once. See toolchain-cache.yml.
  warm-toolchain-cache:
    uses: ./.github/workflows/toolchain-cache.yml

  canonical:
    name: canonical ${{ matrix.device }} (${{ matrix.core }})
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: p16f877a
            core: pic14
          - device: p18f4550
            core: pic18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Docs/allowlisted PRs skip the Docker build and full cargo test
      # loop but still run the cheap always-on lint (the prose job above),
      # mirroring epic-hal's non-code handling. Anything off the allowlist
      # (scripts/ci-test.sh, workflow files, code) runs the full gate.
      - name: Determine non-code
        id: noncode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            result="$(python3 scripts/ci_noncode_check.py '${{ github.event.pull_request.base.sha }}')"
          else
            result="false"
          fi
          echo "non_code=$result" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo target dir
        if: steps.noncode.outputs.non_code != 'true'
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}-${{ matrix.device }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-

      - name: Cache cargo home
        if: steps.noncode.outputs.non_code != 'true'
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check device TOMLs match DFP (gen-device --check)
        if: steps.noncode.outputs.non_code != 'true'
        run: |
          echo "Checking device TOMLs against DFP source (skips if DFP not present)..."
          for f in crates/device/devices/*.toml; do
            stem=$(basename "$f" .toml)
            echo "  --check $stem"
            python3 scripts/gen-device.py "$stem" --check || {
              ec=$?
              if [ -d "/opt/microchip/xc8/v4.00/pic/packs" ]; then
                echo "DFP check failed for $stem with DFP present: failing"
                exit $ec
              else
                echo "::warning::DFP absent, ATDF check SKIPPED for $stem. The always-on gate is crates/device/tests/gputils_crosscheck.rs"
              fi
            }
          done

      - name: Test every workspace crate
        if: steps.noncode.outputs.non_code != 'true'
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home \
            -v "$GITHUB_STEP_SUMMARY:$GITHUB_STEP_SUMMARY" -e GITHUB_STEP_SUMMARY \
            epic-cc-ci:latest bash scripts/ci-test.sh

      # The docker run above executes as root, so target/ ends up
      # root-owned on this bind-mounted host path. Without this, the
      # "Cache cargo target dir" step's post-job save fails silently
      # (tar: Permission denied on target/debug/incremental/**/*.lock),
      # and the cache above never actually saves.
      - name: Fix target dir ownership (container runs as root)
        if: steps.noncode.outputs.non_code != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" target

  hal-887:
    # epic-hal's 887 firmware is built by this compiler but nothing in either
    # repository compiled it: epic-hal#77 merged an hour and three quarters
    # before epic-cc#107, the fix it needed, and both stayed green. epic-hal
    # has no epic-cc to run, so the gate lives here, where the compiler and its
    # pinned clang already do.
    name: pic16f88x-hal 887 under epic-cc
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out epic-hal
        uses: actions/checkout@v5
        with:
          repository: apojomovsky/epic-hal
          path: hal

      - name: Determine non-code
        id: noncode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            result="$(python3 scripts/ci_noncode_check.py '${{ github.event.pull_request.base.sha }}')"
          else
            result="false"
          fi
          echo "non_code=$result" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo home
        if: steps.noncode.outputs.non_code != 'true'
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the epic-cc binary
        if: steps.noncode.outputs.non_code != 'true'
        run: docker run --rm -v "$PWD:/workspace" -w /workspace -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home -e CARGO_TARGET_DIR=/workspace/target epic-cc-ci:latest bash -c 'cargo build --release -p driver'

      # epic_build.py needs tomllib (python 3.11+); the ci image is 22.04 and
      # ships 3.10, so the script is emitted on the runner and only the compile
      # itself runs in the container.
      - name: Emit the HAL build script
        if: steps.noncode.outputs.non_code != 'true'
        working-directory: hal
        run: python3 scripts/epic_build.py build --module pic16f88x-hal --mcu 16F887 --toolchain epic-cc --epic-cc /cc/release/epic-cc --build-dir build-sim/pic16f88x-hal

      - name: Compile the 887 firmware
        if: steps.noncode.outputs.non_code != 'true'
        run: |
          docker run --rm -v "$PWD/target:/cc:ro" -v "$PWD/hal:/hal" -w /hal \
            -e EPIC_REPO_ROOT=/hal epic-cc-ci:latest \
            sh build-sim/pic16f88x-hal/16F887/build.sh
          hex=hal/build-sim/pic16f88x-hal/16F887-blink.hex
          test -s "$hex" || { echo "::error::no hex produced at $hex"; exit 1; }
          echo "built $hex"

  devices-changed:
    name: devices-changed (lightweight)
    needs: warm-toolchain-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine non-code
        id: noncode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            result="$(python3 scripts/ci_noncode_check.py '${{ github.event.pull_request.base.sha }}')"
          else
            result="false"
          fi
          echo "non_code=$result" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        if: steps.noncode.outputs.non_code != 'true'
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo target dir
        if: steps.noncode.outputs.non_code != 'true'
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-devices-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-devices-
            cargo-${{ runner.os }}-${{ github.workflow }}-

      - name: Cache cargo home
        if: steps.noncode.outputs.non_code != 'true'
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Detect changed device TOMLs vs origin/master
        id: changed
        run: |
          set -euo pipefail
          git fetch origin master --quiet || true
          # PR: diff vs merge-base with origin/master. Push to master: diff is empty (no extra per-device work).
          # workflow_dispatch on a branch: same as PR detection; the nightly workflow covers "all devices".
          base="origin/master"
          if git rev-parse --verify "$base" >/dev/null 2>&1; then
            changed=$(git diff --name-only "$base"...HEAD -- crates/device/devices/*.toml 2>/dev/null || true)
          else
            changed=""
          fi
          if [ -z "$changed" ]; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "devices-changed: no device TOML touched vs $base"
          else
            # Persist list for the next step; also expose via output for debugging.
            printf "%s\n" "$changed" > /tmp/changed_devices.txt
            cat /tmp/changed_devices.txt
            # Escape newlines for GITHUB_OUTPUT multiline value
            {
              echo "changed<<EOF"
              cat /tmp/changed_devices.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Per-device lightweight (only for touched TOMLs)
        run: |
          set -euo pipefail
          if [ ! -f /tmp/changed_devices.txt ]; then
            echo "devices-changed: no device TOML touched, nothing to do"
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            stem=$(basename "$f" .toml)
            echo "::group::sanity $stem ($f)"
            docker run --rm -v "$PWD:/workspace" -w /workspace -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home epic-cc-ci:latest bash scripts/sanity.sh "$stem"
            echo "::endgroup::"
          done < /tmp/changed_devices.txt

      # See the same-named step in the canonical job: docker runs as root,
      # so without this the target dir cache above never actually saves.
      - name: Fix target dir ownership (container runs as root)
        if: steps.noncode.outputs.non_code != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" target 2>/dev/null || true
