# SDCC known bugs (docs/35 section 5 item 2, arbitration). Where epic-cc
# matches the hand-computed expected value and SDCC does not, the case is
# recorded here and excluded from the differential gate. If epic-cc also
# missed the expected value, it belongs in the gap tracker, not here.
# SDCC 4.6.0. Entries keyed by the corpus name and device; sdcc_observed
# is SDCC's final value and expected the hand-computed one epic-cc
# produces. Every entry below was cross-checked under gpsim as well as
# our simulator, so the wrong side is the oracle, not the harness.

[[bug]]
device = "p18f4550"
program = "malloc"
# *p = 0x5A through a raw pointer: epic-cc stores and reads back 0x5A.
# SDCC's pic16 backend treats `unsigned char *` as a generic pointer and
# its dereference path lands elsewhere (0xF6). gpsim agrees with our sim.
sdcc_observed = 0xF6
expected = 0x5A

[[bug]]
device = "p16f877a"
program = "fnptr"
# add1(9) via a function pointer: epic-cc computes 0xA. SDCC's pic14
# computed-call sequence (PCL write) returns 0xF4. gpsim agrees with our
# sim.
sdcc_observed = 0xF4
expected = 0xA

[[bug]]
device = "p16f1938"
program = "fnptr"
# Same SDCC pic14-family computed-call bug on the Enhanced core (0xCF).
sdcc_observed = 0xCF
expected = 0xA

[[bug]]
device = "p16f877a"
program = "recursion"
# fact(5) = 120 = 0x78. SDCC's pic14 backend uses static overlay
# registers with no hardware stack, so recursive calls clobber each
# other's n and it returns 0x1. gpsim agrees with our sim.
sdcc_observed = 0x1
expected = 0x78

[[bug]]
device = "p16f1938"
program = "recursion"
# Same SDCC static-overlay recursion corruption on the Enhanced core.
sdcc_observed = 0x1
expected = 0x78

# i64 on the pic14-family cores is an SDCC limitation, not a bug: SDCC's
# pic14 port has no 64-bit integer type at all (docs/35 section 3 PIC14
# table: "no support for 64 bit integer types"), so `long long` does not
# compile (error 206). epic-cc supports it; the probe cannot run against
# SDCC here, so it is excluded rather than a mismatch.
[[bug]]
device = "p16f877a"
program = "i64"
# SDCC error 206 (no 64-bit on pic14); epic computes 0x9A.
sdcc_observed = 0
expected = 0x9A

[[bug]]
device = "p16f1938"
program = "i64"
# SDCC error 206 (no 64-bit on pic14); epic computes 0x9A.
sdcc_observed = 0
expected = 0x9A

# printf %f on p18f4550 (epic-cc#352): SDCC compiles, links, and runs the
# probe, but its `out` stays 0x00 while epic-cc folds 0x41. The %f core
# works (sprintf formats "d=3.500000" into RAM on the same image); what
# never fires is printf's putchar call. #352 showed the user sink links
# once and works direct-called, yet printf and fprintf miss it for %d and
# %f alike, with stdout NULL, rerouted to STREAM_USER, or via
# fprintf(STREAM_USER). Breakpoints on the true-layout image show printf
# and __stream_putchar run while neither sink ever executes; gpsim agrees.
[[bug]]
device = "p18f4550"
program = "printf-f"
sdcc_observed = 0x0
expected = 0x41

[[bug]]
# EEPROM on p18f4550: SDCC compiles the probe but its int-to-pointer
# conversion never reaches the register window (EEDATA/EEADR/EECON2 see
# no writes; EECON1 sees only two 0x80 writes from SDCC's own runtime,
# a value nowhere in the probe). Both reads return stale EEDATA:
# 0x7F, not 0x80. Same generic-pointer defect class as malloc; the
# misrouting is in SDCC's address computation, upstream of any sim
# model (the stores are ordinary MOVWF/MOVFF our own probe exercises).
# epic-cc performs the real unlock-and-commit cycle.
device = "p18f4550"
program = "eeprom-p18"
sdcc_observed = 0x7F
expected = 0x80

# printf %f on the pic14-family cores is an SDCC limitation, same class
# as i64: the pic14 port ships no libc at all (manual 4.9.8), so the
# probe neither links printf nor agrees with our libc's putchar contract.
# epic-cc's libc prints %f (the #295 formatter); the probe folds the
# first six output bytes of "d=3.50" into 0x41.
[[bug]]
device = "p16f877a"
program = "printf-f"
sdcc_observed = 0
expected = 0x41

[[bug]]
device = "p16f1938"
program = "printf-f"
# Same pic14-family libc absence on the Enhanced core.
sdcc_observed = 0
expected = 0x41
