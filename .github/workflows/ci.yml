name: ci

# Stratified CI per the PIC variants design (2026-08-22 §8, ADR-019).
#
# A compiler bug is core-wide (wrong isel for a C construct, fails on one
# pic14 iff it fails on every pic14) or data-wide (wrong TOML value -
# caught by schema + one sanity compile for that device). Running
# devices × fixtures × fuzz on every PR is the HAL trap.
#
# Split:
# - canonical per core (always, full): p16f877a (pic14) + p18f4550 (pic18).
#   Fixed 2-job matrix. Runs the full gate that ran as the single job
#   before: cargo test for every crate (15 e2e fixtures → HEX → gpasm
#   byte-match + sim + fuzz seeded). Cost O(cores)=2, not O(devices).
# - per-device lightweight (on change, cheap, ~0.5 s/device): for each
#   devices/*.toml touched in the PR diff, schema/invariants + alloc
#   empty-prog + 80-byte global placement + asm flash-bound + single
#   add.c → HEX + gpasm -p <device> round-trip. No fuzz, no float tortures.
#
# PR CI = canonical full + lightweight only for TOMLs touched in the diff
# (git diff --name-only origin/master -- crates/device/devices/*.toml).
# Nightly cron = lightweight for all devices (see nightly.yml).
# Full per-device fuzz never, a fuzz bug is core-wide and the canonical
# already found it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  canonical:
    name: canonical ${{ matrix.device }} (${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: p16f877a
            core: pic14
          - device: p18f4550
            core: pic18
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo target dir
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}-${{ matrix.device }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-

      - name: Cache cargo home
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test every workspace crate (full gate)
        run: docker run --rm -v "$PWD:/workspace" -w /workspace -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home epic-cc-ci:latest bash scripts/ci-test.sh

  devices-changed:
    name: devices-changed (lightweight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ci image (cached)
        uses: docker/build-push-action@v6
        with:
          target: ci
          load: true
          tags: epic-cc-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true

      - name: Cache cargo target dir
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-devices-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-devices-
            cargo-${{ runner.os }}-${{ github.workflow }}-

      - name: Cache cargo home
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-home
          key: cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Detect changed device TOMLs vs origin/master
        id: changed
        run: |
          set -euo pipefail
          git fetch origin master --quiet || true
          # PR: diff vs merge-base with origin/master. Push to master: diff is empty (no extra per-device work).
          # workflow_dispatch on a branch: same as PR detection; the nightly workflow covers "all devices".
          base="origin/master"
          if git rev-parse --verify "$base" >/dev/null 2>&1; then
            changed=$(git diff --name-only "$base"...HEAD -- crates/device/devices/*.toml 2>/dev/null || true)
          else
            changed=""
          fi
          if [ -z "$changed" ]; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "devices-changed: no device TOML touched vs $base"
          else
            # Persist list for the next step; also expose via output for debugging.
            printf "%s\n" "$changed" > /tmp/changed_devices.txt
            cat /tmp/changed_devices.txt
            # Escape newlines for GITHUB_OUTPUT multiline value
            {
              echo "changed<<EOF"
              cat /tmp/changed_devices.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Per-device lightweight (only for touched TOMLs)
        run: |
          set -euo pipefail
          if [ ! -f /tmp/changed_devices.txt ]; then
            echo "devices-changed: no device TOML touched, nothing to do"
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            stem=$(basename "$f" .toml)
            echo "::group::sanity $stem ($f)"
            docker run --rm -v "$PWD:/workspace" -w /workspace -v /tmp/cargo-home:/opt/cargo-home -e CARGO_HOME=/opt/cargo-home epic-cc-ci:latest bash scripts/sanity.sh "$stem"
            echo "::endgroup::"
          done < /tmp/changed_devices.txt
