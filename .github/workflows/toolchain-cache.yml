name: toolchain-cache

# Warms ghcr.io/<repo>-toolchain's registry cache once per workflow run, so
# concurrent jobs that each build the `ci`/`release` image against the same
# cache-from/cache-to ref (canonical x2 + hal-887 + devices-changed in
# ci.yml; devices-all + sdcc-parity in nightly.yml; the single build job in
# rolling-release.yml/release.yml) don't race to independently rebuild and
# push it. On a warm cache this is a few-second cache-from hit; on a cold
# cache (a real clang-builder/base Dockerfile change, or the pinned ubuntu
# digest bumping) it pays the ~2h LLVM build exactly once instead of once
# per concurrent consumer. Callers add `needs: <job-name-that-calls-this>`
# ahead of their own image-building jobs.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  warm:
    name: warm toolchain cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No load/push/tags: this job only needs the registry cache
      # populated, not a local or published image. Every other job's own
      # "Build ci image (cached)" (or `docker buildx build --target
      # release`) step then hits CACHED against what this pushes.
      - name: Build + push the toolchain cache (ci target)
        uses: docker/build-push-action@v6
        with:
          target: ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-toolchain,mode=max,ignore-error=true
